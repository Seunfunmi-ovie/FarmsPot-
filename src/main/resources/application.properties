spring.application.name=farmsPotLoanApp

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/farmspot_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:farmsPot}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Email Configuration (Brevo SMTP relay)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Sender shown on emails (must match the verified sender in Brevo)
mail.from-email=${MAIL_FROM_EMAIL:oluwaseunpu@gmail.com}
mail.from-name=${MAIL_FROM_NAME:FarmsPot}